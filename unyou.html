<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!--build:32-->
<title>動画運用代行スケジュール</title>
<style>
  :root{
    --navy:#2E1F4A; --navy-2:#43315F; --gold:#F2C14E;
    --red:#E23E57; --today:#D8365A;
    --ink:#1B1730; --ink-60:#6B6480; --ink-35:#A9A2BC;
    --line:#E4DFF0; --soft:#F7F4FC;
    --done:#0F6E5C; --made:#3F6BB5; --alert:#E4572E;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:#fff;color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.4;
    -webkit-text-size-adjust:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit}

  header{flex:0 0 auto;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
  .hrow{display:flex;align-items:center;gap:8px}
  .title{font-family:var(--mincho);font-size:16px;font-weight:600;letter-spacing:.04em;margin:0;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .save-state{font-size:9px;color:#BDB2DC;white-space:nowrap}
  .gear{border:1px solid rgba(255,255,255,.3);background:transparent;color:#D5CCEC;
    font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tabs{display:flex;gap:5px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;min-width:68px;border:1px solid rgba(255,255,255,.28);background:transparent;
    color:#D5CCEC;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;
    white-space:nowrap;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--gold);color:#3A2A12;border-color:var(--gold)}
  .tab .cnt{font-family:var(--mono);font-size:10px;opacity:.8;margin-left:5px}
  .tab .bd{font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 6px;margin-left:5px;
    letter-spacing:.02em}
  .tab .bd.td{background:var(--today);color:#fff}
  .tab .bd.tm{background:var(--gold);color:#3A2A12}
  .tab[aria-selected="true"] .bd.tm{background:#3A2A12;color:var(--gold)}
  .namebar{margin-top:7px;background:var(--navy-2);border-radius:11px;padding:8px 10px}
  .nb-stats{display:flex;gap:6px;flex-wrap:wrap}
  .nb-stats span{font-size:10px;color:#BDB2DC;background:rgba(255,255,255,.10);
    border-radius:7px;padding:3px 8px;white-space:nowrap}
  .nb-stats b{font-family:var(--mono);font-size:12.5px;color:#fff;font-weight:700;margin:0 1px}
  .nb-stats span.warn{background:rgba(242,193,78,.22);color:#FFDFA0}
  .nb-stats span.warn b{color:var(--gold)}
  .nb-stats span.ok b{color:#8FE0C6}
  .nb-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:6px;
    padding-top:6px;border-top:1px solid rgba(255,255,255,.14)}
  .fld{display:flex;align-items:center;gap:5px;min-width:0}
  .fld>span{flex:0 0 auto;font-size:10px;color:#BDB2DC;white-space:nowrap}
  .fld>em{font-style:normal;font-size:10px;color:#BDB2DC}
  .fld input{flex:1;min-width:0;width:100%;color:#fff;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:3px 6px;
    font-family:var(--gothic);font-size:13.5px}
  .fld input[type="number"]{font-family:var(--mono);font-weight:700;text-align:center;flex:0 0 46px}
  .fld.sm>span{font-size:9.5px}
  .fld.sm input[type="date"]{font-family:var(--mono);font-size:11px;padding:2px 3px;
    flex:1 1 0;width:100%;min-width:0}
  .fld-row{grid-column:1 / -1;display:flex;gap:7px;min-width:0}
  .fld-row .fld{flex:1 1 0;min-width:0}
  .fld-row .fld.sm{flex:1 1 0}
  .fld input.miss{border-color:var(--gold);background:rgba(242,193,78,.16)}
  .fld input::placeholder{color:#8E82B4}
  .fld input:focus{outline:2px solid var(--gold);outline-offset:1px}

  .banner{flex:0 0 auto;display:block;width:100%;text-align:left;border:0;cursor:pointer;
    background:#FDF3D3;color:#7A5B10;font-size:12px;font-weight:600;line-height:1.5;
    padding:8px 12px;border-bottom:1px solid #EFDFAE}
  .banner[hidden]{display:none}

  .notice{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    padding:7px 12px;background:#FFF6F1;border-bottom:1px solid #F6DFD3}
  .notice::-webkit-scrollbar{display:none}
  .notice[hidden]{display:none}
  .nchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;max-width:80vw;
    border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;
    font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
  .nchip .who{font-weight:600;opacity:.9;overflow:hidden;text-overflow:ellipsis}
  .nchip.today{background:var(--today);color:#fff}
  .nchip.tomo{background:#FFE9B8;color:#7A4E06;border-color:#F2C14E}
  .nchip.over{background:#FFE3D7;color:#A8391A;border-color:#F0B49B}
  .nchip.left{background:#3A2E6E;color:#fff}
  .nchip.need{background:#fff;color:#7A4E06;border-color:var(--gold)}

  .monthbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px}
  .navbtn{width:42px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;
    color:#4B7BEC;font-size:16px;cursor:pointer}
  .navbtn:active{background:var(--soft)}
  .month{font-family:var(--mincho);font-size:19px;font-weight:600;flex:1;text-align:center}
  .month .now{font-family:var(--gothic);font-size:12px;color:var(--red);margin-left:7px;font-weight:700}

  .total{flex:0 0 auto;display:flex;gap:14px;justify-content:center;align-items:baseline;
    padding:0 12px 7px;font-family:var(--mono);font-size:11.5px;color:var(--ink-60)}
  .total b{font-size:14px;color:var(--ink)}
  .total .ok b{color:var(--done)}
  .total .ng b{color:var(--alert)}
  .grid{flex:1 1 auto;display:grid;grid-template-columns:1fr 1px 1fr;gap:0 10px;
    padding:0 12px 4px;overflow:hidden;min-height:0}
  .grid.scrolls{overflow-y:auto}
  .divider{background:var(--line)}
  .col{display:flex;flex-direction:column;justify-content:space-between;min-height:0}
  .day{display:flex;align-items:center;gap:5px;
    padding:calc(1px * var(--dscale,1)) 3px;border-radius:7px;
    border-bottom:1px solid #F4F1FA}
  .day.is-shoot{border-bottom-color:transparent;border-radius:8px;
    box-shadow:inset 0 0 0 1.5px var(--made);background:#F2F6FC}
  .day.is-meet{border-bottom-color:transparent;border-radius:8px;
    box-shadow:inset 0 0 0 1.5px #B8AFD2}
  .day.is-today{background:transparent;border-bottom-color:transparent;border-radius:8px;
    box-shadow:inset 0 0 0 1.5px var(--today)}
  .day.is-today.is-shoot{background:#FFF6F8;
    box-shadow:inset 0 0 0 1.5px var(--today), inset 0 0 0 4px rgba(63,107,181,.30)}
  .shoot-tag{background:var(--made);color:#fff;font-size:9px;font-weight:700;
    padding:1px 5px;border-radius:5px;white-space:nowrap;flex:0 0 auto}
  .meet-tag{background:#E7E2F3;color:#5A4E86;font-size:9px;font-weight:700;
    padding:1px 5px;border-radius:5px;white-space:nowrap;flex:0 0 auto}
  .dlabel{display:flex;align-items:center;gap:5px;border:0;background:transparent;
    padding:calc(3px * var(--dscale,1)) 0;cursor:pointer;flex:1;min-width:0;text-align:left}
  .dnum{font-family:var(--mono);font-size:calc(13.5px * var(--dscale,1));font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .day.wk .dnum{color:var(--red)}
  .today-tag{background:var(--today);color:#fff;font-size:9px;font-weight:700;
    padding:1px 5px;border-radius:5px;white-space:nowrap;flex:0 0 auto}
  .more{font-family:var(--mono);font-size:10px;color:var(--ink-60);border:0;background:transparent;
    cursor:pointer;padding:2px}
  .marks{display:flex;gap:4px;flex:0 0 auto}
  .tg{font-size:calc(11px * var(--dscale,1));font-weight:700;border-radius:6px;
    padding:calc(3px * var(--dscale,1)) calc(8px * var(--dscale,1));cursor:pointer;
    border:1px dashed #C3BADB;background:var(--soft);color:#8E82B4}
  .tg.on{border-style:solid}
  .tg.made.on{background:var(--made);border-color:var(--made);color:#fff}
  .tg.posted.on{background:var(--done);border-color:var(--done);color:#fff}
  .tg.num{min-width:30px;font-family:var(--mono);padding:3px 6px}
  .tg.num.on{background:var(--gold);border-color:var(--gold);color:#3A2A12;border-style:solid}

  .bar{flex:0 0 auto;display:flex;gap:7px;padding:7px 12px calc(env(safe-area-inset-bottom) + 8px);
    border-top:1px solid var(--line);background:#fff}
  .bar button{flex:1;padding:10px 5px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer}
  .bar button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}

  .scrim{position:fixed;inset:0;background:rgba(27,23,48,.45);z-index:40;opacity:0;pointer-events:none;transition:.18s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;
    border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(100%);transition:.22s ease;max-height:86vh;overflow:auto}
  .sheet.show{transform:translateY(0)}
  .sheet h2{font-family:var(--mincho);font-size:18px;margin:0 0 12px}
  .slot{border:1px solid var(--line);border-left:3px solid var(--ink-35);border-radius:12px;
    padding:11px;margin-bottom:9px}
  .slot.on{border-left-color:var(--made)}
  .slot.done{border-left-color:var(--done);background:#F5FAF9}
  .slot-head{font-size:12px;font-weight:700;color:var(--ink-60);margin-bottom:8px;letter-spacing:.05em}
  .chips{display:flex;gap:6px;margin-bottom:9px}
  .chip{flex:1;border:1px solid var(--line);background:#F6F4FB;color:var(--ink-60);
    font-size:13px;font-weight:700;padding:10px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .chip.made.on{background:var(--made);border-color:var(--made);color:#fff}
  .chip.posted.on{background:var(--done);border-color:var(--done);color:#fff}
  .chip.on::before{content:"✓ "}
  .f-label{font-size:11px;color:var(--ink-60);margin:0 0 4px;display:block}
  textarea,input[type="date"],.cfg-row input{width:100%;font-size:16px;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;background:#FBFAFE;padding:9px;font-family:var(--gothic)}
  textarea{min-height:52px;resize:vertical;line-height:1.5}
  textarea:focus,input:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:transparent}
  .sheet-add{width:100%;border:1px dashed var(--ink-35);background:var(--soft);color:#4A3B6B;
    font-size:14px;font-weight:700;padding:12px;border-radius:11px;cursor:pointer;margin-top:12px}
  .sheet-close{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-size:14px;font-weight:700;padding:13px;border-radius:11px;cursor:pointer}
  .cfg-row{margin-bottom:10px}
  .cfg-row input{font-family:var(--mono)}
  .cfg-note{font-size:11px;color:var(--ink-60);line-height:1.6;margin:2px 0 14px}
  .cfg-actions{display:flex;gap:8px}
  .cfg-actions button{flex:1;padding:13px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink)}
  .cfg-actions button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .cfg-sec{font-family:var(--mincho);font-size:15px;font-weight:600;margin:22px 0 10px;
    padding-top:14px;border-top:1px solid var(--line)}
  .cfg-sec:first-of-type{margin-top:4px;padding-top:0;border-top:0}
  .del-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .del-row input.nm{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;background:#FBFAFE;padding:7px 9px;
    font-family:var(--gothic)}
  .del-row small{font-family:var(--mono);font-size:11px;color:var(--ink-60)}
  .del-row button.del{border:1px solid #F0B49B;background:#FFF3EF;color:var(--alert);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer}
  .ord{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
  .ord button{border:1px solid var(--line);background:#fff;color:var(--navy);
    font-size:11px;line-height:1;padding:4px 8px;border-radius:6px;cursor:pointer}
  .ord button:disabled{opacity:.3}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 class="title">動画運用代行スケジュール<span style="font-size:9px;opacity:.5;margin-left:6px">v32</span></h1>
    <span class="save-state" id="saveState"></span>
    <button class="gear" id="cfgBtn">⚙ 設定</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="namebar">
    <div class="nb-stats" id="stat"></div>
    <div class="nb-grid">
      <label class="fld"><span>今月の契約</span>
        <input type="number" id="goal" min="0" max="200" inputmode="numeric"><em>本</em></label>
      <label class="fld"><span>契約総数</span>
        <input type="number" id="totalGoal" min="0" max="9999" inputmode="numeric"><em>本</em></label>
      <div class="fld-row">
        <label class="fld"><span>担当</span>
          <input id="ed0" maxlength="14" placeholder="制作担当"></label>
        <label class="fld sm"><span>打合</span><input type="date" id="dMeet"></label>
        <label class="fld sm"><span>撮影</span><input type="date" id="dShoot"></label>
      </div>
    </div>
  </div>
</header>

<button class="banner" id="banner" hidden></button>
<div class="notice" id="notice" hidden></div>

<div class="monthbar">
  <button class="navbtn" id="prevM" aria-label="前の月">‹</button>
  <div class="month" id="monthLabel"></div>
  <button class="navbtn" id="nextM" aria-label="次の月">›</button>
</div>

<div class="total" id="total"></div>

<div class="grid">
  <div class="col" id="colL"></div>
  <div class="divider"></div>
  <div class="col" id="colR"></div>
</div>

<div class="bar">
  <button id="todayBtn">今月へ</button>
  <button id="copyBtn">一覧をコピー</button>
  <button id="csvBtn" class="primary">CSV書き出し</button>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h2 id="sheetTitle"></h2>
  <div id="sheetBody"></div>
  <button class="sheet-close" id="sheetClose">閉じる</button>
</div>

<div class="sheet" id="cfgSheet" role="dialog" aria-modal="true">
  <h2>設定</h2>
  <p class="cfg-sec">オンライン同期</p>
  <div class="cfg-row"><label class="f-label">リポジトリ（owner/repo）</label>
    <input id="cOwner" placeholder="RPG-ENTERTAINMENT/talent-app-data" autocapitalize="off" autocorrect="off"></div>
  <div class="cfg-row"><label class="f-label">保存ファイルのパス</label>
    <input id="cPath" placeholder="data/unyou.json" autocapitalize="off" autocorrect="off"></div>
  <div class="cfg-row"><label class="f-label">ブランチ</label>
    <input id="cBranch" placeholder="main" autocapitalize="off" autocorrect="off"></div>
  <div class="cfg-row"><label class="f-label">アクセストークン</label>
    <input id="cToken" type="password" placeholder="github_pat_..." autocapitalize="off" autocorrect="off"></div>
  <p class="cfg-note">トークンはこの端末の中だけに保存され、送信先はGitHubのみです。対象リポジトリ1つ・Contents（読み書き）だけに絞ったFine-grainedトークンを使ってください。他の端末でも同じ内容を入力すると同じデータが共有されます。</p>
  <div class="cfg-actions">
    <button id="cClose">閉じる</button>
    <button id="cSave" class="primary">保存して同期</button>
  </div>
  <p class="cfg-sec">効果音</p>
  <div class="del-row" style="border-bottom:0">
    <span style="flex:1;font-size:14px;font-weight:600">ボタンの音</span>
    <button id="sndBtn"></button>
  </div>
  <p class="cfg-sec">アカウントの並び替え・削除</p>
  <p class="cfg-note">名前はここで変更できます。↑↓でタブの表示順を変更できます。削除すると、そのアカウントの予定・最低投稿数・担当がすべて消え、他の端末からも消えます。</p>
  <div id="delList"></div>
  <button class="sheet-add" id="addAcct">＋ アカウントを追加</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY="rpg-video-schedule-v3";
  var MAXSLOT=4;
  var WD=["日","月","火","水","木","金","土"];

  /* データは端末に保存せず、常にオンライン（GitHub）のみ */
  try{ localStorage.removeItem(KEY); }catch(e){}

  var state=null, active=0, view=new Date(), openDate=null, saveTimer=null;
  var BUILD=32, lastCheck=0;

  /* ---- 効果音 ---- */
  var SND_KEY="unyou-sound", sndOn=true, actx=null;
  try{ sndOn=(localStorage.getItem(SND_KEY)||"1")==="1"; }catch(e){}
  function beep(freq,dur,vol,type){
    if(!sndOn) return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      if(!actx) actx=new AC();
      if(actx.state==="suspended") actx.resume();
      var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.09));
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+(dur||0.09)+0.02);
    }catch(e){}
  }
  function clickSound(el){
    if(!el) return;
    var on=el.classList.contains("on");
    if(el.classList.contains("del")) { beep(300,0.10,0.06,"triangle"); setTimeout(function(){ beep(200,0.12,0.05,"triangle"); },90); return; }
    if(el.classList.contains("tg")||el.classList.contains("chip")) return beep(on?420:760,0.07,0.05,"sine");
    if(el.classList.contains("tab")) return beep(620,0.06,0.04,"sine");
    if(el.classList.contains("nchip")) return beep(700,0.07,0.045,"sine");
    beep(540,0.06,0.04,"sine");
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest?ev.target.closest("button"):null;
    if(b) clickSound(b);
  },true);

  /* 最新版の自動取り込み */
  async function checkUpdate(){
    if(location.protocol==="file:") return;
    if(Date.now()-lastCheck<30000) return;
    lastCheck=Date.now();
    try{
      var r=await fetch(location.pathname+"?cb="+Date.now(),{cache:"no-store"});
      if(!r.ok) return;
      var t=await r.text();
      var m=t.match(/<!--build:(\d+)-->/);
      if(!m) return;
      var latest=Number(m[1]);
      if(latest>BUILD){
        var key="unyou-reloaded-"+latest;
        try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key,"1"); }catch(e){}
        location.replace(location.pathname+"?b="+latest);
      }
    }catch(e){}
  }

  /* ---- オンライン同期（GitHub） ---- */
  var CFG_KEY="rpg-video-sync-cfg";
  var cfg={repo:"RPG-ENTERTAINMENT/talent-app-data",path:"data/unyou.json",branch:"main",token:""};
  var sha=null, syncing=false, pushTimer=null, etag=null, dirty=false, loaded=false;

  function loadCfg(){
    try{ var c=JSON.parse(localStorage.getItem(CFG_KEY)||"null"); if(c) cfg=Object.assign(cfg,c); }catch(e){}
  }
  function saveCfg(){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); }catch(e){} }
  function cfgReady(){ return !!(cfg.repo&&cfg.path&&cfg.token); }
  function setStatus(t){ document.getElementById("saveState").textContent=t; }
  function hhmm(d){ return p2(d.getHours())+":"+p2(d.getMinutes()); }
  function stamp(e){ e.up=Date.now(); }

  function b64enc(str){
    var bytes=new TextEncoder().encode(str), bin="";
    bytes.forEach(function(b){ bin+=String.fromCharCode(b); });
    return btoa(bin);
  }
  function b64dec(b64){
    var bin=atob(String(b64).replace(/\s/g,"")), a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(a);
  }
  function ghUrl(){
    return "https://api.github.com/repos/"+cfg.repo+"/contents/"+cfg.path.replace(/^\//,"");
  }
  function ghHeaders(){
    return {"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json"};
  }
  async function ghGet(useEtag){
    var h=ghHeaders();
    if(useEtag&&etag) h["If-None-Match"]=etag;
    var r=await fetch(ghUrl()+"?ref="+encodeURIComponent(cfg.branch||"main"),
      {headers:h,cache:"no-store"});
    if(r.status===304) return "same";
    if(r.status===404){
      var chk=await fetch("https://api.github.com/repos/"+cfg.repo,{headers:ghHeaders(),cache:"no-store"});
      if(chk.status===404) throw new Error("リポジトリが見つからない／トークンの対象に入っていません");
      if(!chk.ok) throw new Error("リポジトリ確認に失敗 "+chk.status);
      return null;
    }
    if(r.status===401) throw new Error("トークンが無効・期限切れ");
    if(r.status===403) throw new Error("権限不足（Contents読み書きを確認）");
    if(!r.ok) throw new Error("取得失敗 "+r.status);
    etag=r.headers.get("ETag");
    var j=await r.json();
    sha=j.sha;
    try{ return JSON.parse(b64dec(j.content)); }catch(e){ return null; }
  }
  async function ghPut(data){
    var body={message:"update schedule "+new Date().toISOString(),
      content:b64enc(JSON.stringify(data)),branch:cfg.branch||"main"};
    if(sha) body.sha=sha;
    var r=await fetch(ghUrl(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHeaders()),
      body:JSON.stringify(body)});
    if(r.status===409||r.status===422){
      var remote=await ghGet();
      if(remote) data=mergeStates(remote,data);
      body.content=b64enc(JSON.stringify(data)); body.sha=sha;
      r=await fetch(ghUrl(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHeaders()),
        body:JSON.stringify(body)});
    }
    if(!r.ok) throw new Error(r.status===403?"書き込み権限なし":"保存失敗 "+r.status);
    var j=await r.json(); if(j.content) sha=j.content.sha;
    return data;
  }
  function mergeStates(a,b){
    var out={pages:[]};
    var n=Math.max((a&&a.pages&&a.pages.length)||0,(b&&b.pages&&b.pages.length)||0,1);
    for(var i=0;i<n;i++){
      var pa=(a&&a.pages&&a.pages[i])||{name:"",nameUp:0,items:[]};
      var pb=(b&&b.pages&&b.pages[i])||{name:"",nameUp:0,items:[]};
      var pdel=((pa.delUp||0)>(pb.delUp||0))?pa.del:(pb.del!==undefined?pb.del:pa.del);
      var name=((pa.nameUp||0)>(pb.nameUp||0))?pa.name:(pb.name||pa.name);
      var map={};
      (pa.items||[]).forEach(function(e){ map[e.id]=e; });
      (pb.items||[]).forEach(function(e){
        var o=map[e.id];
        if(!o || (e.up||0)>=(o.up||0)) map[e.id]=e;
      });
      var items=Object.keys(map).map(function(k){ return map[k]; })
        .sort(function(x,y){ return x.date<y.date?-1:1; });
      var goal=((pa.goalUp||0)>(pb.goalUp||0))?pa.goal:(pb.goal!==undefined?pb.goal:pa.goal);
      var eds=((pa.editorsUp||0)>(pb.editorsUp||0))?pa.editors:(pb.editors||pa.editors);
      var tot=((pa.totalUp||0)>(pb.totalUp||0))?pa.total:(pb.total!==undefined?pb.total:pa.total);
      var plans={}, pl1=pa.plans||{}, pl2=pb.plans||{};
      Object.keys(pl1).forEach(function(k){ plans[k]=pl1[k]; });
      Object.keys(pl2).forEach(function(k){
        if(!plans[k] || (pl2[k].up||0)>=(plans[k].up||0)) plans[k]=pl2[k];
      });
      out.pages.push({name:name,nameUp:Math.max(pa.nameUp||0,pb.nameUp||0),
        goal:(goal||0),goalUp:Math.max(pa.goalUp||0,pb.goalUp||0),
        editors:(eds||["",""]),editorsUp:Math.max(pa.editorsUp||0,pb.editorsUp||0),
        total:(tot||0),totalUp:Math.max(pa.totalUp||0,pb.totalUp||0),
        del:!!pdel,delUp:Math.max(pa.delUp||0,pb.delUp||0),
        plans:plans,items:items});
    }
    return out;
  }
  async function syncNow(silent){
    if(!cfgReady()||syncing) return;
    syncing=true; setStatus("同期中…");
    try{
      var remote=await ghGet(!dirty);
      if(remote==="same"){
        setStatus("同期済み "+hhmm(new Date()));
        syncing=false; return;
      }
      var before=JSON.stringify(state);
      if(remote) remote=normalize(remote);
      if(remote && !dirty && !loaded){ state=remote; }
      else if(remote){ state=normalize(mergeStates(remote,state)); }
      var wasFirst=!loaded;
      loaded=true;
      if(wasFirst && fixAllNumbers()){ dirty=true; schedulePush(); }
      var after=JSON.stringify(state);
      var needPush = dirty || !remote || after!==JSON.stringify(remote);
      if(needPush){ await ghPut(state); dirty=false; etag=null; }
      setStatus("同期済み "+hhmm(new Date()));
      if(after!==before||needPush){ renderAll(); if(openDate) renderSheet(); }
    }catch(err){
      setStatus("同期エラー");
      if(!silent) toast("同期エラー：" + (err&&err.message||err));
    }
    syncing=false;
  }
  function schedulePush(){
    if(!cfgReady()) return;
    clearTimeout(pushTimer);
    pushTimer=setTimeout(function(){ syncNow(true); },2500);
  }
  function showError(msg){
    var b=document.getElementById("banner");
    if(!b) return;
    b.hidden=false;
    b.style.background="#FFE3D7"; b.style.color="#A8391A";
    b.textContent="エラー: "+msg;
  }
  window.onerror=function(m,src,line,col){ showError(m+" ("+line+":"+col+")"); };

  function refreshBanner(){
    var b=document.getElementById("banner");
    if(b) b.hidden=true;
  }

  function monthItems(){
    var pre=view.getFullYear()+"-"+p2(view.getMonth()+1);
    return itemsOf(state.pages[active]).filter(function(e){ return e.date.indexOf(pre)===0; });
  }

  function p2(n){ return (n<10?"0":"")+n; }
  function iso(y,m,d){ return y+"-"+p2(m+1)+"-"+p2(d); }
  function todayISO(){ var d=new Date(); return iso(d.getFullYear(),d.getMonth(),d.getDate()); }
  function shiftISO(n){ var d=new Date(); d.setDate(d.getDate()+n); return iso(d.getFullYear(),d.getMonth(),d.getDate()); }
  function defaultState(){
    return {pages:[{name:"アカウント①",goal:0,editors:["",""],plans:{},items:[]},
                   {name:"アカウント②",goal:0,editors:["",""],plans:{},items:[]},
                   {name:"アカウント③",goal:0,editors:["",""],plans:{},items:[]},
                   {name:"アカウント④",goal:0,editors:["",""],plans:{},items:[]}]};
  }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function dayItems(date){
    return itemsOf(state.pages[active]).filter(function(e){ return e.date===date; })
      .sort(function(a,b){ return (a.slot||1)-(b.slot||1); });
  }
  function slotItem(date,n,create){
    var arr=state.pages[active].items;
    for(var i=0;i<arr.length;i++) if(arr[i].date===date&&(arr[i].slot||1)===n){
      if(arr[i].del){ if(!create) continue; arr[i].del=false; arr[i].up=Date.now(); }
      return arr[i];
    }
    if(!create) return null;
    var e={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),date:date,slot:n,
           memo:"",made:false,posted:false,up:Date.now()};
    arr.push(e); return e;
  }
  function pageCount(){ return (state&&state.pages)?state.pages.length:0; }
  function orderOf(){
    var n=pageCount();
    var o=(state&&Array.isArray(state.order))?state.order.slice():[];
    o=o.filter(function(v,i){ return typeof v==="number"&&v>=0&&v<n&&o.indexOf(v)===i; });
    for(var i=0;i<n;i++) if(o.indexOf(i)<0) o.push(i);
    return o;
  }
  function liveOrder(){ return orderOf().filter(function(i){ return !state.pages[i].del; }); }

  function blankPage(nm){
    return {name:nm||"新しいアカウント",nameUp:Date.now(),goal:0,goalUp:0,
            total:0,totalUp:0,editors:["",""],editorsUp:0,plans:{},items:[],del:false,delUp:0};
  }

  function normalize(st){
    var src0=(st&&Array.isArray(st.pages))?st.pages:[];
    var d=defaultState();
    while(d.pages.length<src0.length && d.pages.length<12) d.pages.push(blankPage("アカウント"+(d.pages.length+1)));
    var src=src0;
    for(var i=0;i<d.pages.length;i++){
      var p=src[i]||{}, np=d.pages[i];
      if(typeof p.name==="string"&&p.name) np.name=p.name;
      np.nameUp=Number(p.nameUp)||0;
      np.goal=Number(p.goal)||0;
      np.goalUp=Number(p.goalUp)||0;
      np.total=Number(p.total)||0;
      np.totalUp=Number(p.totalUp)||0;
      np.del=!!p.del; np.delUp=Number(p.delUp)||0;
      np.editors=Array.isArray(p.editors)?[String(p.editors[0]||""),String(p.editors[1]||"")]:["",""];
      np.editorsUp=Number(p.editorsUp)||0;
      np.plans={};
      if(p.plans&&typeof p.plans==="object"){
        Object.keys(p.plans).forEach(function(k){
          var v=p.plans[k]||{};
          np.plans[k]={meet:String(v.meet||"").slice(0,10),
                       shoot:String(v.shoot||"").slice(0,10),
                       goal:Number(v.goal)||0,
                       up:Number(v.up)||0};
        });
      }
      var cutoff=Date.now()-1000*60*60*24*90;
      np.items=(Array.isArray(p.items)?p.items:[]).filter(function(e){ return e&&e.date; })
        .filter(function(e){ return !(e.del && (Number(e.up)||0) < cutoff); })
        .map(function(e){
          return {id:String(e.id||(e.date+"-"+(e.slot||1)+"-"+i+"-"+Math.random().toString(36).slice(2,6))),
                  date:String(e.date).slice(0,10),
                  slot:Number(e.slot)||1, no:Number(e.no)||0,
                  made:!!e.made, posted:!!e.posted,
                  memo:String(e.memo||""), up:Number(e.up)||0, del:!!e.del};
        });
    }
    var o=(st&&Array.isArray(st.order))?st.order.slice():[];
    o=o.filter(function(v,i){ return typeof v==="number"&&v>=0&&v<d.pages.length&&o.indexOf(v)===i; });
    for(var i=0;i<d.pages.length;i++) if(o.indexOf(i)<0) o.push(i);
    d.order=o; d.orderUp=Number(st&&st.orderUp)||0;
    return d;
  }

  function monthKey(){ return view.getFullYear()+"-"+p2(view.getMonth()+1); }
  function planOf(p,key,create){
    if(!p.plans) p.plans={};
    if(!p.plans[key]){
      if(!create) return {meet:"",shoot:"",goal:0,up:0};
      p.plans[key]={meet:"",shoot:"",goal:0,up:0};
    }
    return p.plans[key];
  }
  function goalFor(p,key){
    var pl=(p.plans&&p.plans[key])||null;
    if(pl&&Number(pl.goal)>0) return Number(pl.goal);
    return Number(p.goal)||0;
  }
  function itemsOf(p){ return (p.items||[]).filter(function(e){ return !e.del; }); }
  function planned(e){ return !!(e && !e.posted && (e.made||e.no||(e.memo||"").trim())); }
  function used(e){ return !!(e && (e.made||e.posted||e.no||(e.memo||"").trim())); }

  function monthNumbered(){
    return monthItems().filter(function(e){ return e.no; })
      .sort(function(a,b){ return a.no-b.no; });
  }
  function fixNumbers(p,key){
    var changed=false, now=Date.now(), list=[];
    itemsOf(p).forEach(function(e){
      if(e.date.indexOf(key)!==0) return;
      if((e.slot||1)!==1){                 /* 番号は1本目だけに付ける */
        if(e.no){ e.no=0; e.up=now; changed=true; }
        return;
      }
      if(e.no) list.push(e);
    });
    list.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
    list.forEach(function(e,i){ if(e.no!==i+1){ e.no=i+1; e.up=now; changed=true; } });
    return changed;
  }
  function fixAllNumbers(){
    var changed=false;
    state.pages.forEach(function(p){
      if(p.del) return;
      var keys={};
      itemsOf(p).forEach(function(e){ if(e.no) keys[e.date.slice(0,7)]=1; });
      Object.keys(keys).forEach(function(k){ if(fixNumbers(p,k)) changed=true; });
    });
    return changed;
  }

  function renumber(){
    monthNumbered().slice().sort(function(a,b){
      return a.date<b.date?-1:(a.date>b.date?1:(a.slot||1)-(b.slot||1));
    }).forEach(function(e,i){ if(e.no!==i+1){ e.no=i+1; e.up=Date.now(); } });
  }
  function cleanup(){
    var arr=state.pages[active].items;
    for(var i=arr.length-1;i>=0;i--) if(!arr[i].del&&!used(arr[i])) arr.splice(i,1);
  }
  function toggleNo(date){
    var e=slotItem(date,1,true);
    if(e.no){ e.no=0; e.up=Date.now(); cleanup(); renumber(); }
    else{
      var goal=goalFor(state.pages[active],monthKey());
      var n=monthNumbered().length;
      if(goal&&n>=goal){ toast("今月の契約本数 "+goal+"本ぶん、すでに日程が決まっています"); cleanup(); return; }
      e.no=n+1; e.up=Date.now();
      renumber();
    }
    scheduleSave(); renderAll(); if(openDate) renderSheet();
  }

  function scheduleSave(){
    dirty=true;
    setStatus(cfgReady()?"同期待ち…":"未保存（同期未設定）");
    schedulePush();
  }

  /* ---------- header ---------- */
  function renderHeader(){
    var t=document.getElementById("tabs"); t.innerHTML="";
    var pre=monthKey();
    liveOrder().forEach(function(i){
      var p=state.pages[i];
      var b=document.createElement("button");
      b.className="tab"; b.setAttribute("role","tab");
      b.setAttribute("aria-selected", i===active?"true":"false");
      var pit=itemsOf(p);
      var posted=pit.filter(function(e){ return e.posted&&e.date.indexOf(pre)===0; }).length;
      var td=pit.filter(function(e){ return planned(e)&&e.date===todayISO(); }).length;
      var tm=pit.filter(function(e){ return planned(e)&&e.date===shiftISO(1); }).length;
      var pgoal=goalFor(p,pre);
      b.innerHTML=esc(p.name)+'<span class="cnt">'+posted+(pgoal?"/"+pgoal:"")+'</span>'+
        (td?'<span class="bd td">今日'+td+'</span>':'')+
        (tm?'<span class="bd tm">明日'+tm+'</span>':'');
      b.onclick=function(){ active=i; renderAll(); };
      t.appendChild(b);
    });

    var pg=state.pages[active], mk=monthKey();

    var gnow=goalFor(pg,mk);
    var g=document.getElementById("goal");
    if(document.activeElement!==g) g.value=gnow||"";
    g.classList.toggle("miss",!gnow);

    var tg=document.getElementById("totalGoal");
    if(document.activeElement!==tg) tg.value=pg.total||"";
    tg.classList.toggle("miss",!pg.total);

    if(!pg.editors) pg.editors=["",""];
    var e0=document.getElementById("ed0");
    if(document.activeElement!==e0) e0.value=pg.editors[0]||"";
    e0.classList.toggle("miss",!pg.editors[0]);

    var pl=planOf(pg,mk,false);
    [["dMeet","meet"],["dShoot","shoot"]].forEach(function(x){
      var el=document.getElementById(x[0]);
      if(document.activeElement!==el) el.value=pl[x[1]]||"";
      el.classList.toggle("miss",!pl[x[1]]);
    });

    var mi=monthItems();
    var posted=mi.filter(function(e){ return e.posted; }).length;
    var slotted=mi.filter(function(e){ return e.no; }).length;
    var allPosted=itemsOf(pg).filter(function(e){ return e.posted; }).length;
    var restNow=gnow?gnow-posted:0, restAll=pg.total?pg.total-allPosted:0;
    var html='<span>今月 <b>'+posted+'</b>'+(gnow?'/'+gnow:'')+'</span>';
    if(gnow) html+='<span class="'+(restNow<=0?"ok":"warn")+'">今月の残り <b>'+(restNow>0?restNow:0)+'</b></span>';
    html+='<span>日程 <b>'+slotted+'</b>'+(gnow?'/'+gnow:'')+'</span>';
    html+='<span>累計 <b>'+allPosted+'</b>'+(pg.total?'/'+pg.total:'')+'</span>';
    if(pg.total) html+='<span class="'+(restAll<=0?"ok":"warn")+'">契約の残り <b>'+(restAll>0?restAll:0)+'</b></span>';
    document.getElementById("stat").innerHTML=html;
  }

  /* ---------- month grid ---------- */
  function renderMonth(){
    var y=view.getFullYear(), m=view.getMonth(), now=new Date();
    document.getElementById("monthLabel").innerHTML=
      y+"年"+(m+1)+"月"+((y===now.getFullYear()&&m===now.getMonth())?'<span class="now">今月</span>':'');
    if(fixNumbers(state.pages[active],monthKey())) scheduleSave();
    var pl=planOf(state.pages[active],monthKey(),false);
    var last=new Date(y,m+1,0).getDate(), half=Math.ceil(last/2), td=todayISO();

    /* その月の予定を一度だけ索引化（日ごとの走査をなくす） */
    var pre=monthKey(), byDate={};
    itemsOf(state.pages[active]).forEach(function(e){
      if(e.date.indexOf(pre)!==0) return;
      (byDate[e.date]||(byDate[e.date]=[])).push(e);
    });

    var L=[], R=[];
    for(var d=1; d<=last; d++){
      var date=iso(y,m,d), wd=new Date(y,m,d).getDay();
      var list=byDate[date]||[], first=null, extra=0;
      for(var k=0;k<list.length;k++){
        var it=list[k];
        if((it.slot||1)===1) first=it;
        else if(used(it)) extra++;
      }
      var html='<div class="day'+((wd===0||wd===6)?" wk":"")+
        ((date===pl.shoot)?" is-shoot":"")+((date===pl.meet)?" is-meet":"")+
        ((date===td)?" is-today":"")+'">'+
        '<button class="dlabel" data-date="'+date+'"><span class="dnum">'+p2(d)+'日（'+WD[wd]+'）</span>'+
        (date===td?'<span class="today-tag">今日</span>':'')+
        (date===pl.shoot?'<span class="shoot-tag">撮影</span>':'')+
        (date===pl.meet?'<span class="meet-tag">打合</span>':'')+
        (extra?'<span class="more">+'+extra+'</span>':'')+'</button>'+
        '<div class="marks">'+
        '<button class="tg num'+(first&&first.no?" on":"")+'" data-k="no" data-date="'+date+'">'+
          (first&&first.no?first.no:"＋")+'</button>'+
        '<button class="tg made'+(first&&first.made?" on":"")+'" data-k="made" data-date="'+date+'">制</button>'+
        '<button class="tg posted'+(first&&first.posted?" on":"")+'" data-k="posted" data-date="'+date+'">投</button>'+
        '</div></div>';
      (d<=half?L:R).push(html);
    }
    document.getElementById("colL").innerHTML=L.join("");
    document.getElementById("colR").innerHTML=R.join("");
  }

  /* クリックは grid 側で一括処理（ボタンごとの登録をやめる） */
  document.querySelector(".grid").addEventListener("click",function(ev){
    var b=ev.target.closest?ev.target.closest("button"):null;
    if(!b) return;
    var date=b.dataset.date;
    if(!date) return;
    if(b.classList.contains("dlabel")) return openSheet(date);
    if(b.dataset.k==="no") return toggleNo(date);
    if(b.dataset.k) toggle(date,1,b.dataset.k);
  });

  function toggle(date,slot,k){
    var e=slotItem(date,slot,true);
    e[k]=!e[k];
    if(k==="posted"&&e.posted&&!e.made) e.made=true;
    if(k==="made"&&!e.made&&e.posted) e.posted=false;
    e.up=Date.now();
    cleanup();
    scheduleSave(); renderAll(); if(openDate) renderSheet();
  }

  var repaired=false;
  function renderTotal(){
    var key=monthKey(), goal=0, posted=0, made=0;
    state.pages.forEach(function(p){
      if(p.del) return;
      goal+=goalFor(p,key);
      var mi=itemsOf(p).filter(function(e){ return e.date.indexOf(key)===0; });
      posted+=mi.filter(function(e){ return e.posted; }).length;
      made+=mi.filter(function(e){ return e.made&&!e.posted; }).length;
    });
    var rest=goal-posted;
    document.getElementById("total").innerHTML=
      '<span>契約 <b>'+goal+'</b>本</span>'+
      '<span>投稿 <b>'+posted+'</b>本</span>'+
      '<span>制作待ち <b>'+made+'</b>本</span>'+
      '<span class="'+(rest<=0?"ok":"ng")+'">残り <b>'+(rest>0?rest:0)+'</b>本</span>';
  }

  var fitKey="";
  function fitGrid(force){
    var grid=document.querySelector(".grid");
    var key=monthKey()+"|"+(window.innerHeight||0)+"|"+(window.innerWidth||0);
    if(!force && key===fitKey) return;
    fitKey=key;
    var L=document.getElementById("colL"), R=document.getElementById("colR");
    if(!grid||!L) return;
    var avail=grid.clientHeight;
    if(!avail) return;
    var root=document.documentElement;
    for(var pass=0;pass<3;pass++){
      var cur=parseFloat(getComputedStyle(root).getPropertyValue("--dscale"))||1;
      var need=Math.max(L.scrollHeight,R.scrollHeight);
      if(!need) return;
      if(need<=avail && cur>=1) break;
      var k=cur*(avail/need);
      if(k>1) k=1;
      if(k<0.62) k=0.62;
      if(Math.abs(k-cur)<0.01) break;
      root.style.setProperty("--dscale",k.toFixed(3));
    }
    var over=Math.max(L.scrollHeight,R.scrollHeight)>avail+2;
    grid.classList.toggle("scrolls",over);
  }

  function renderAll(){
    if(!state||!Array.isArray(state.pages)||!state.pages.length||!state.pages[0]||!Array.isArray(state.pages[0].items))
      state=normalize(state);
    if(!state.pages[active]||state.pages[active].del){ var lv=liveOrder(); active=lv.length?lv[0]:0; }
    try{ renderHeader(); renderMonth(); renderNotice(); renderTotal();
      if(window.requestAnimationFrame) requestAnimationFrame(fitGrid); else fitGrid(); }
    catch(err){
      if(repaired){ showError("描画 "+(err&&err.message||err)); return; }
      repaired=true;
      state=normalize(state);
      renderHeader(); renderMonth(); renderNotice(); renderTotal();
      repaired=false;
    }
  }

  /* ---------- notice ---------- */
  function renderNotice(){
    var box=document.getElementById("notice");
    var t=todayISO(), tm=shiftISO(1), hits=[];
    state.pages.forEach(function(p,pi){
      if(p.del) return;
      itemsOf(p).forEach(function(e){
        if(e.posted) return;
        if(!(e.made||(e.memo||"").trim())) return;
        if(e.date<t)        hits.push({k:"over",rank:0,label:"投稿日すぎ",e:e,pi:pi,p:p});
        else if(e.date===t) hits.push({k:"today",rank:1,label:"当日投稿！",e:e,pi:pi,p:p});
        else if(e.date===tm)hits.push({k:"tomo",rank:2,label:"投稿1日前",e:e,pi:pi,p:p});
      });
    });
    var extras=[], key=monthKey();
    state.pages.forEach(function(p,pi){
      if(p.del) return;
      var mi=itemsOf(p).filter(function(e){ return e.date.indexOf(key)===0; });
      var posted=mi.filter(function(e){ return e.posted; }).length;
      var gl=goalFor(p,key);
      if(gl){
        var rest=gl-posted;
        if(rest>0&&rest<=3) extras.push({cls:"left",txt:"残り "+rest+"本",who:p.name,pi:pi});
      }
      var pl=planOf(p,key,false);
      if(gl&&(!pl.meet||!pl.shoot)){
        var miss=(!pl.meet&&!pl.shoot)?"打ち合わせ日・撮影日":(!pl.meet?"打ち合わせ日":"撮影日");
        extras.push({cls:"need",txt:miss+"を設定してください",who:p.name,pi:pi,focus:!pl.meet?"dMeet":"dShoot"});
      }
    });
    if(!hits.length&&!extras.length){ box.hidden=true; box.innerHTML=""; return; }
    hits.sort(function(a,b){ return a.rank-b.rank || (a.e.date<b.e.date?-1:1); });
    box.hidden=false; box.innerHTML="";
    extras.forEach(function(x){
      var b=document.createElement("button");
      b.className="nchip "+x.cls;
      b.innerHTML=esc(x.txt)+'<span class="who">'+esc(x.who)+'</span>';
      b.onclick=function(){
        active=x.pi; renderAll();
        if(x.focus){ var el=document.getElementById(x.focus); el.focus(); if(el.showPicker) try{ el.showPicker(); }catch(e){} }
      };
      box.appendChild(b);
    });
    hits.forEach(function(h){
      var d=new Date(h.e.date+"T00:00:00"), memo=(h.e.memo||"").split("\n")[0];
      var b=document.createElement("button");
      b.className="nchip "+h.k;
      b.innerHTML=esc(h.label)+'<span class="who">'+esc(h.p.name)+' '+(d.getMonth()+1)+'/'+d.getDate()+
        ' '+(h.e.slot||1)+'本目'+(memo?'・'+esc(memo.slice(0,8)):'')+'</span>';
      b.onclick=function(){ active=h.pi; view=new Date(h.e.date+"T00:00:00"); renderAll(); openSheet(h.e.date); };
      box.appendChild(b);
    });
  }

  /* ---------- day sheet ---------- */
  function renderSheet(){
    var body=document.getElementById("sheetBody"); body.innerHTML="";
    for(var n=1;n<=MAXSLOT;n++){
      (function(n){
        var e=slotItem(openDate,n,false);
        var w=document.createElement("div");
        w.className="slot"+(e&&e.posted?" done":(e&&e.made?" on":""));
        var runNo=(n===1&&e&&e.no)?'（今月 '+e.no+'本目）':'';
        w.innerHTML='<div class="slot-head">'+n+'本目'+runNo+'</div>'+
          '<div class="chips">'+
            '<button class="chip made'+(e&&e.made?" on":"")+'" data-k="made">制作済み</button>'+
            '<button class="chip posted'+(e&&e.posted?" on":"")+'" data-k="posted">投稿済み</button>'+
          '</div>'+
          '<label class="f-label">メモ</label>'+
          '<textarea placeholder="撮影内容・台本・確認事項など">'+esc(e&&e.memo?e.memo:"")+'</textarea>';
        Array.prototype.forEach.call(w.querySelectorAll(".chip"),function(c){
          c.onclick=function(){ toggle(openDate,n,c.dataset.k); };
        });
        w.querySelector("textarea").addEventListener("input",function(ev){
          var it=slotItem(openDate,n,true);
          it.memo=ev.target.value; it.up=Date.now(); scheduleSave(); renderMonth(); renderNotice();
        });
        body.appendChild(w);
      })(n);
    }
  }
  function openSheet(date){
    openDate=date;
    var d=new Date(date+"T00:00:00");
    document.getElementById("sheetTitle").textContent=
      (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）の予定";
    renderSheet();
    document.getElementById("scrim").classList.add("show");
    document.getElementById("sheet").classList.add("show");
  }
  function closeSheet(){
    openDate=null;
    document.getElementById("scrim").classList.remove("show");
    document.getElementById("sheet").classList.remove("show");
    renderAll();
  }
  document.getElementById("sheetClose").onclick=closeSheet;

  /* ---------- config sheet ---------- */
  function refreshSndBtn(){
    var b=document.getElementById("sndBtn");
    b.textContent=sndOn?"オン":"オフ";
    b.style.cssText="border:1px solid "+(sndOn?"var(--navy)":"var(--line)")+
      ";background:"+(sndOn?"var(--navy)":"#fff")+";color:"+(sndOn?"#fff":"var(--ink-60)")+
      ";font-size:13px;font-weight:700;padding:8px 20px;border-radius:9px;cursor:pointer";
  }
  document.getElementById("sndBtn").onclick=function(){
    sndOn=!sndOn;
    try{ localStorage.setItem(SND_KEY,sndOn?"1":"0"); }catch(e){}
    refreshSndBtn();
    if(sndOn) beep(760,0.08,0.06,"sine");
  };

  function renderDelList(){
    var box=document.getElementById("delList");
    box.innerHTML="";
    var ord=liveOrder();
    ord.forEach(function(i,pos){
      var p=state.pages[i];
      var n=itemsOf(p).filter(used).length;
      var row=document.createElement("div");
      row.className="del-row";
      row.innerHTML='<span class="ord"><button class="up" aria-label="上へ"'+(pos===0?" disabled":"")+'>▲</button>'+
        '<button class="down" aria-label="下へ"'+(pos===ord.length-1?" disabled":"")+'>▼</button></span>'+
        '<input class="nm" maxlength="20" value="'+esc(p.name||("アカウント"+(i+1)))+'">'+
        '<small>'+n+'件</small><button class="del">削除</button>';
      row.querySelector(".nm").addEventListener("input",function(ev){
        p.name=ev.target.value; p.nameUp=Date.now();
        scheduleSave(); renderHeader(); renderNotice();
      });
      row.querySelector(".up").onclick=function(){ moveAccount(i,-1); };
      row.querySelector(".down").onclick=function(){ moveAccount(i,1); };
      row.querySelector(".del").onclick=function(){
        if(ord.length<=1){ toast("アカウントは1つ以上必要です"); return; }
        var nm=p.name||("アカウント"+(i+1));
        if(!confirm("「"+nm+"」を削除します。\n予定 "+n+"件・契約本数・担当がすべて消え、他の端末からも消えます。\n削除しますか？")) return;
        if(!confirm("本当に削除してよろしいですか？この操作は元に戻せません。")) return;
        var now=Date.now();
        (p.items||[]).forEach(function(e){ e.del=true; e.up=now; });
        p.del=true; p.delUp=now;
        var lv=liveOrder(); active=lv.length?lv[0]:0;
        scheduleSave(); renderAll(); renderDelList();
        toast("「"+nm+"」を削除しました");
      };
      box.appendChild(row);
    });
  }

  function addAccount(){
    var live=liveOrder();
    if(live.length>=12){ toast("アカウントは12件までです"); return; }
    var nm=prompt("追加するアカウント名を入力してください","");
    if(nm===null) return;
    nm=(nm||"").trim()||("アカウント"+(live.length+1));
    var now=Date.now(), idx=-1;
    for(var i=0;i<state.pages.length;i++) if(state.pages[i].del){ idx=i; break; }
    if(idx>=0){
      var p=state.pages[idx];
      p.del=false; p.delUp=now;
      p.name=nm; p.nameUp=now;
      p.goal=0; p.goalUp=now; p.total=0; p.totalUp=now;
      p.editors=["",""]; p.editorsUp=now; p.plans={};
    } else {
      state.pages.push(blankPage(nm));
      idx=state.pages.length-1;
    }
    var o=orderOf();
    if(o.indexOf(idx)<0) o.push(idx);
    state.order=o; state.orderUp=now;
    active=idx;
    scheduleSave(); renderAll(); renderDelList();
    toast("「"+nm+"」を追加しました");
  }
  document.getElementById("addAcct").onclick=addAccount;

  function moveAccount(pi,dir){
    var o=orderOf(), live=liveOrder();
    var lp=live.indexOf(pi), target=live[lp+dir];
    if(lp<0||target===undefined) return;
    var a=o.indexOf(pi), b=o.indexOf(target);
    o[a]=target; o[b]=pi;
    state.order=o; state.orderUp=Date.now();
    scheduleSave(); renderAll(); renderDelList();
  }

  function openCfg(){
    document.getElementById("cOwner").value=cfg.repo;
    document.getElementById("cPath").value=cfg.path;
    document.getElementById("cBranch").value=cfg.branch;
    document.getElementById("cToken").value=cfg.token;
    refreshSndBtn();
    renderDelList();
    document.getElementById("scrim").classList.add("show");
    document.getElementById("cfgSheet").classList.add("show");
  }
  function closeCfg(){
    document.getElementById("scrim").classList.remove("show");
    document.getElementById("cfgSheet").classList.remove("show");
  }
  document.getElementById("cfgBtn").onclick=openCfg;
  document.getElementById("banner").onclick=openCfg;
  document.getElementById("cClose").onclick=closeCfg;
  document.getElementById("cSave").onclick=function(){
    cfg.repo=document.getElementById("cOwner").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");
    cfg.path=document.getElementById("cPath").value.trim()||"data/unyou.json";
    cfg.branch=document.getElementById("cBranch").value.trim()||"main";
    cfg.token=document.getElementById("cToken").value.trim();
    saveCfg(); sha=null; refreshBanner(); closeCfg();
    if(cfgReady()) syncNow(false); else toast("トークンを入力してください");
  };
  document.getElementById("scrim").onclick=function(){ closeSheet(); closeCfg(); };

  /* ---------- controls ---------- */
  document.getElementById("goal").addEventListener("input",function(e){
    var v=parseInt(e.target.value,10); v=isNaN(v)?0:Math.max(0,v);
    var pg=state.pages[active], now=Date.now();
    var pl=planOf(pg,monthKey(),true);
    pl.goal=v; pl.up=now;
    pg.goal=v; pg.goalUp=now;
    scheduleSave(); renderHeader(); renderNotice(); renderTotal(); });
  document.getElementById("ed0").addEventListener("input",function(e){
    var pg=state.pages[active];
    if(!pg.editors) pg.editors=["",""];
    pg.editors[0]=e.target.value; pg.editorsUp=Date.now();
    scheduleSave();
  });
  document.getElementById("totalGoal").addEventListener("input",function(e){
    var v=parseInt(e.target.value,10);
    state.pages[active].total=isNaN(v)?0:Math.max(0,v);
    state.pages[active].totalUp=Date.now();
    scheduleSave(); renderHeader(); });

  [["dMeet","meet"],["dShoot","shoot"]].forEach(function(x){
    document.getElementById(x[0]).addEventListener("change",function(e){
      var pl=planOf(state.pages[active],monthKey(),true);
      pl[x[1]]=e.target.value; pl.up=Date.now();
      scheduleSave(); renderAll();
    });
  });
  document.getElementById("totalGoal").addEventListener("input",function(e){
    var v=parseInt(e.target.value,10);
    state.pages[active].total=isNaN(v)?0:Math.max(0,v);
    state.pages[active].totalUp=Date.now();
    scheduleSave(); renderHeader(); });

  document.getElementById("prevM").onclick=function(){ view=new Date(view.getFullYear(),view.getMonth()-1,1); renderAll(); };
  document.getElementById("nextM").onclick=function(){ view=new Date(view.getFullYear(),view.getMonth()+1,1); renderAll(); };
  document.getElementById("todayBtn").onclick=function(){ view=new Date(); renderAll(); };

  function toast(m){ var t=document.getElementById("toast"); t.textContent=m;
    t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); },1600); }

  document.getElementById("copyBtn").onclick=function(){
    var p=state.pages[active];
    var mi=monthItems().filter(used).sort(function(a,b){
      return a.date<b.date?-1:(a.date>b.date?1:(a.slot||1)-(b.slot||1)); });
    var posted=mi.filter(function(e){ return e.posted; }).length;
    var eds=(p.editors||[]).filter(Boolean).join("・");
    var txt="【"+p.name+"】"+view.getFullYear()+"年"+(view.getMonth()+1)+"月"+
      "（投稿 "+posted+(goalFor(p,monthKey())?" / 契約 "+goalFor(p,monthKey())+"本":"")+(eds?" / 動画制作担当 "+eds:"")+"）\n"+
      (mi.length?mi.map(function(e){
        var d=new Date(e.date+"T00:00:00");
        return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"+(e.slot||1)+"本目 制作"+
          (e.made?"✓":"−")+" 投稿"+(e.posted?"✓":"−")+(e.memo?" / "+e.memo.replace(/\n/g," "):"");
      }).join("\n"):"予定なし");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("コピーしました"); },function(){ fb(txt); });
    } else fb(txt);
  };
  function fb(txt){
    var ta=document.createElement("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("コピーしました"); }catch(e){ toast("コピーできませんでした"); }
    document.body.removeChild(ta);
  }

  document.getElementById("csvBtn").onclick=function(){
    var rows=[["ページ","動画制作担当","契約本数","日付","本目","制作済み","投稿済み","メモ"]];
    state.pages.forEach(function(p){
      if(p.del) return;
      itemsOf(p).filter(used).slice().sort(function(a,b){
        return a.date<b.date?-1:(a.date>b.date?1:(a.slot||1)-(b.slot||1)); }).forEach(function(e){
        rows.push([p.name,(p.editors||[]).filter(Boolean).join("・"),p.goal||"",e.date,
                   (e.slot||1),e.made?"1":"",e.posted?"1":"",e.memo]);
      });
    });
    var csv="\uFEFF"+rows.map(function(c){ return c.map(function(v){
      return '"'+String(v||"").replace(/"/g,'""')+'"'; }).join(","); }).join("\r\n");
    var url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    var a=document.createElement("a"); a.href=url; a.download="unyou-"+todayISO()+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },3000);
    toast("CSVを書き出しました");
  };

  (function(){
    loadCfg(); refreshBanner();
    state=normalize(null);
    try{ renderAll(); }catch(e){ showError("初期描画 "+(e&&e.message||e)); }
    setStatus(cfgReady()?"読み込み中…":"同期未設定（⚙ 設定から）");

    requestAnimationFrame(function(){ setTimeout(function(){
      if(cfgReady()){
        syncNow(true);
        setInterval(function(){ if(!document.hidden) syncNow(true); },60000);
        window.addEventListener("focus",function(){ syncNow(true); });
      }
      setTimeout(checkUpdate,4000);
      document.addEventListener("visibilitychange",function(){
        if(document.hidden) return;
        checkUpdate();
        if(cfgReady()) syncNow(true);
      });
      window.addEventListener("resize",function(){ fitGrid(true); });
      window.addEventListener("orientationchange",function(){ setTimeout(function(){ fitGrid(true); },300); });
      window.addEventListener("pageshow",function(ev){
        if(ev.persisted){ checkUpdate(); if(cfgReady()) syncNow(true); }
      });
      window.addEventListener("beforeunload",function(ev){
        if(dirty){ ev.preventDefault(); ev.returnValue=""; }
      });
    },0); });
  })();
})();
</script>
</body>
</html>
